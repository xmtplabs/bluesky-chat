name = "bluesky-chat-mapping-service"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[vars]
IDENTITY_PROVIDER = "bluesky"

# Rate limiting bindings
# @see https://developers.cloudflare.com/workers/runtime-apis/bindings/rate-limit/
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 1000, period = 60 }  # 1000 requests per minute for public endpoints

[[unsafe.bindings]]
name = "ADMIN_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 100, period = 60 }  # 100 requests per minute for admin endpoints

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "bluesky-chat-mappings"
database_id = "1c8db7fa-ac06-4784-b371-f3437a576e79"

# Durable Objects for Jetstream indexer
[durable_objects]
bindings = [
  { name = "JETSTREAM_INDEXER", class_name = "JetstreamIndexer" }
]

[[migrations]]
tag = "v1"
new_classes = ["JetstreamIndexer"]

# Environment-specific configuration
[env.production]
# Production D1 database ID (set after creating)
# d1_databases = [{ binding = "DB", database_name = "bluesky-chat-mappings", database_id = "PROD_ID" }]

[env.staging]
# Staging D1 database ID (set after creating)
# d1_databases = [{ binding = "DB", database_name = "bluesky-chat-mappings-staging", database_id = "STAGING_ID" }]

# Nostr environment — separate Worker with its own D1 database, no indexer
[env.nostr]
name = "nostr-chat-mapping-service"

[env.nostr.vars]
IDENTITY_PROVIDER = "nostr"

[env.nostr.durable_objects]
bindings = []

[[env.nostr.d1_databases]]
binding = "DB"
database_name = "nostr-chat-mappings"
database_id = "1accdee0-015f-4a80-beb5-f581d7ba5c4b"

[[env.nostr.unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 1000, period = 60 }

[[env.nostr.unsafe.bindings]]
name = "ADMIN_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 100, period = 60 }
